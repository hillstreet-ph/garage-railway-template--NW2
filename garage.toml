# Garage configuration for the Railway template (single node).
# Secrets are NOT stored here: Garage reads them from the environment
# (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN, GARAGE_METRICS_TOKEN).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
metadata_snapshots_dir = "/var/lib/garage/snapshots"

# SQLite survives an unclean stop better than LMDB on a single node.
db_engine = "sqlite"
metadata_fsync = true
metadata_auto_snapshot_interval = "6h"

# Single node: no replication.
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
